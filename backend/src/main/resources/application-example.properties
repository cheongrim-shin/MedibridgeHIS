####################################################################
# application-example.properties
#
# 이 파일은 "어떤 설정이 필요한지"를 알려주는 템플릿입니다.
# 실제 값은 커밋하지 않고 환경변수로 주입합니다.
#
# [사용법]
#   1) 이 파일을 application.properties 로 복사
#   2) 아래 "필요한 환경변수" 목록을 OS 환경변수로 등록
#   3) 애플리케이션 실행
#
# [필요한 환경변수]
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   JWT_SECRET, AES_SECRET_KEY
#   GEMINI_API_KEY, HIRA_API_KEY, PORTONE_API_SECRET
#
#   ※ ${VAR:기본값} 형태는 환경변수가 없으면 기본값을 사용합니다.
#      비밀값에는 기본값을 두지 않습니다 (누락 시 부팅 단계에서 실패 = 조기 발견).
####################################################################

spring.application.name=MedibridgeHISBE

logging.level.ddit=DEBUG

server.port=${SERVER_PORT:80}


# ------------------------------------------------------------------
# DataSource — Oracle
# 접속 정보 3개 모두 환경변수로 주입합니다.
# URL/계정명도 비밀로 취급하는 이유: 공용 DB 서버라 서버 주소와
# 계정 명명 규칙이 노출되면 다른 팀 계정까지 추측 대상이 됩니다.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# ------------------------------------------------------------------
# MyBatis
# ------------------------------------------------------------------
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=varchar

mybatis.mapper-locations=classpath:mybatis/mapper/**/*-Mapper.xml

mybatis.type-aliases-package= ddit.physicalTherapist.vo\
                            , ddit.medicine.vo\
                            , ddit.receptionist.vo\
                            , ddit.admin.vo


# ------------------------------------------------------------------
# 인증 — JWT
# 32byte(256bit) 이상 랜덤 문자열
#   생성 예) openssl rand -base64 48
# ------------------------------------------------------------------
jwt.secret=${JWT_SECRET}


# ------------------------------------------------------------------
# 암호화 — 주민번호 뒷 6자리 AES-256-GCM
# Base64 인코딩된 정확히 32byte 키
#   생성 예) openssl rand -base64 32
#
# ⚠️ 키를 교체하면 기존에 암호화된 데이터를 복호화할 수 없습니다.
#    교체 시 데이터 마이그레이션 또는 초기화가 필요합니다.
# ------------------------------------------------------------------
crypto.aes-key=${AES_SECRET_KEY}


# ------------------------------------------------------------------
# 외부 API
# ------------------------------------------------------------------
# Google Gemini — https://aistudio.google.com/apikey
gemini.api.key=${GEMINI_API_KEY}

# 건강보험심사평가원 (공공데이터포털) — https://www.data.go.kr
hira.api.key=${HIRA_API_KEY}

# PortOne V2 결제 — https://admin.portone.io
portone.api-secret=${PORTONE_API_SECRET}


# ------------------------------------------------------------------
# LM Studio (로컬 LLM) — API 키 불필요
# 환자 정보를 외부로 보내지 않기 위해 로컬에서 구동합니다.
# base-url 은 실행 환경마다 다르므로 환경변수로 덮어쓸 수 있게 둡니다.
# ------------------------------------------------------------------
lmstudio.base-url=${LMSTUDIO_BASE_URL:http://localhost:1234/v1}
lmstudio.model=${LMSTUDIO_MODEL:google/gemma-4-e2b}
lmstudio.timeout-ms=120000
